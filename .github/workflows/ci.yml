name: Validate native Always-on plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - run: npm ci
      - run: npm run check
      - name: Install bundle in disposable real Harness Web profile
        run: DSH_HOME="$PWD/.artifacts/dsh" npx dsh plugin --profile web add "$PWD"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: always-on-validation
          path: |
            *.tgz
            playwright-report/
            test-results/*-harness.png
          retention-days: 14
