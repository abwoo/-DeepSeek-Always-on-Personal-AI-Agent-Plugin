name: Validate native Always-on plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - run: npm ci
      - run: npm run check
      - name: Install bundle in disposable real Harness Web profile
        run: DSH_HOME="$PWD/.artifacts/dsh" npx dsh plugin --profile web add "$PWD"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: always-on-validation
          path: |
            *.tgz
            playwright-report/
            test-results/*-harness.png
          retention-days: 14
  alpha-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native-and-browser
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: always-on-validation
          path: release-artifacts
      - name: Publish a tested alpha tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p 'require("./package.json").version')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it immutable."
          else
            gh release create "$TAG" release-artifacts/*.tgz --target "$GITHUB_SHA" --prerelease --title "DeepSeek Always-on $TAG" --notes-file docs/RELEASE_NOTES.md
          fi
