name: Managed authority and device protocol
on:
  push:
    branches: [main]
    paths: [src/**, packages/managed/**, packages/client/**, scripts/build-managed*, scripts/managed-admin.mjs, deploy/managed/**, tests/unit/managed-auth.test.ts, .github/workflows/managed-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - uses: pnpm/action-setup@v4
        with: {version: 11.28.5}
      - run: npm ci
      - run: npm run build
      - run: node --import tsx --test tests/unit/managed-auth.test.ts
      - run: node scripts/build-managed.mjs
      - run: node scripts/build-managed-client.mjs
      - run: npm pack --ignore-scripts
      - run: npm pack ./packages/managed --ignore-scripts
      - run: node scripts/build-managed-test.mjs
      - name: Build operator runtime container
        run: docker build -f deploy/managed/Dockerfile -t always-on-managed:test .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-authority-evidence
          path: test-results/managed-authority.json
          retention-days: 14
