name: Native mobile builds
on:
  push:
    branches: [main]
    paths: [apps/mobile/**, packages/client/**, src/shared/**, scripts/build-managed-client.mjs, scripts/mobile-android-smoke.py, scripts/check-ios-screen.swift, .github/workflows/mobile-native.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-managed-client.mjs
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npm run export:native
        working-directory: apps/mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env: {NODE_ENV: production, GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m'}
      - name: Record build scope
        run: |
          mkdir -p mobile-evidence
          apk=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$apk"
          sha256sum "$apk" > mobile-evidence/android-apk-sha256.txt
          node -e 'require("fs").writeFileSync("mobile-evidence/android.json",JSON.stringify({sourceCommit:process.env.GITHUB_SHA,nativeAndroidApkBuilt:true,signing:"development debug key; not a store release",realPhone:false,realDeepSeek:false,mvpReady:false},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-preview
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            mobile-evidence/
          retention-days: 14
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-managed-client.mjs
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Compile actual native simulator application
        shell: bash
        run: |
          workspace=$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -list -json > ios-schemes.json
          python3 -c 'import json,sys;assert sys.argv[1] in json.load(open("ios-schemes.json"))["workspace"]["schemes"]' "$scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/mobile-build" CODE_SIGNING_ALLOWED=NO build > ios-build.log 2>&1
          mkdir -p mobile-evidence
          app=$(find mobile-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          # Simulator-only ad-hoc signature grants a real local Keychain access group.
          # This is not an Apple distribution identity or a physical-device provisioning profile.
          /usr/libexec/PlistBuddy -c 'Add :application-identifier string SIMULATOR0.com.abwoo.deepseekalwayson' mobile-evidence/simulator.entitlements.plist
          /usr/libexec/PlistBuddy -c 'Add :keychain-access-groups array' mobile-evidence/simulator.entitlements.plist
          /usr/libexec/PlistBuddy -c 'Add :keychain-access-groups:0 string SIMULATOR0.com.abwoo.deepseekalwayson' mobile-evidence/simulator.entitlements.plist
          codesign --force --sign - --entitlements mobile-evidence/simulator.entitlements.plist --generate-entitlement-der "$app"
          tar -czf mobile-evidence/ios-simulator-preview.app.tar.gz -C "$(dirname "$app")" "$(basename "$app")"
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json;print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]))')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.abwoo.deepseekalwayson
          sleep 5
          xcrun simctl io "$udid" screenshot mobile-evidence/ios-pairing.png
          swift scripts/check-ios-screen.swift mobile-evidence/ios-pairing.png
          node -e 'require("fs").writeFileSync("mobile-evidence/ios.json",JSON.stringify({sourceCommit:process.env.GITHUB_SHA,nativeSimulatorAppBuilt:true,simulatorLaunch:true,secureStorageStartupPassed:true,simulatorSigning:"local ad-hoc; not physical-device provisioning",installableOnPhysicalIPhone:false,appleSigningCredentialsPresent:false,realPhone:false,mvpReady:false},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-native-preview
          path: |
            mobile-evidence/
            ios-build.log
          retention-days: 14

  android-emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: android-native-preview, path: .artifacts/native-mobile}
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python3 scripts/mobile-android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: mobile-evidence/
          retention-days: 14
