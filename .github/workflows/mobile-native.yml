name: Native mobile builds
on:
  push:
    branches: [main, 'v0.3/**']
    paths:
      [
        config/public-service.json,
        apps/mobile/**,
        packages/client/**,
        src/shared/**,
        scripts/build-managed-client.mjs,
        scripts/mobile-android-smoke.py,
        scripts/mobile-android-contract.py,
        scripts/prepare-native-engineering.mjs,
        scripts/serve-native-fixture.mjs,
        scripts/verify-v03-accounts.mjs,
        tests/fixtures/native-mobile/**,
        scripts/check-ios-screen.swift,
        scripts/verify-ios-simulator.py,
        .github/workflows/mobile-native.yml,
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          { node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-managed-client.mjs
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npm run export:native
        working-directory: apps/mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/mobile
      - run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env: { NODE_ENV: production, GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m' }
      - name: Record build scope
        run: |
          mkdir -p mobile-evidence
          apk=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          test -n "$apk"
          sha256sum "$apk" > mobile-evidence/android-apk-sha256.txt
          node -e 'require("fs").writeFileSync("mobile-evidence/android.json",JSON.stringify({sourceCommit:process.env.GITHUB_SHA,nativeAndroidApkBuilt:true,signing:"development debug key; not a store release",realPhone:false,realDeepSeek:false,mvpReady:false},null,2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-preview
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            mobile-evidence/
          retention-days: 14
      - name: Prepare separate authenticated native engineering flavor
        run: node scripts/prepare-native-engineering.mjs
      - name: Build actual engineering APK with test-only bootstrap and scoped loopback trust
        run: ./gradlew :app:assembleEngineeringRelease --no-daemon
        working-directory: apps/mobile/android
        env: { NODE_ENV: production, GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m' }
      - name: Prepare real Harness packages for native interaction backend
        run: |
          node scripts/build-managed.mjs
          npm pack --ignore-scripts
          npm pack ./packages/managed --ignore-scripts
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual native controls with independent real Harness state verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python3 scripts/mobile-android-contract.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-contract
          path: |
            mobile-evidence/native-contract*
            apps/mobile/android/app/build/outputs/apk/engineering/release/*.apk
          retention-days: 14
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          { node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-managed-client.mjs
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npx expo prebuild --platform ios --no-install
        working-directory: apps/mobile
      - run: pod install
        working-directory: apps/mobile/ios
      - name: Compile actual native simulator application
        shell: bash
        run: |
          workspace=$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -list -json > ios-schemes.json
          python3 -c 'import json,sys;assert sys.argv[1] in json.load(open("ios-schemes.json"))["workspace"]["schemes"]' "$scheme"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/mobile-build" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build > ios-build.log 2>&1
          mkdir -p mobile-evidence
          app=$(find mobile-build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          tar -czf mobile-evidence/ios-native-build.app.tar.gz -C "$(dirname "$app")" "$(basename "$app")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-simulator-binary
          path: |
            mobile-evidence/ios-native-build.app.tar.gz
            ios-build.log
          retention-days: 14
  ios-native-smoke:
    needs: ios-simulator
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ios-native-simulator-binary, path: .artifacts/ios-compiled }
      - name: Unpack actual native binary
        run: |
          mkdir ios-native-build
          archive=$(find .artifacts/ios-compiled -name '*.app.tar.gz' -print -quit)
          test -n "$archive"
          tar -xzf "$archive" -C ios-native-build
      - name: Verify real Simulator launch and secure-storage startup
        run: python3 scripts/verify-ios-simulator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-native-preview
          path: mobile-evidence/
          retention-days: 14

  android-emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: android-native-preview, path: .artifacts/native-mobile }
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python3 scripts/mobile-android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: mobile-evidence/
          retention-days: 14
