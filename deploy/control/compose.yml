# Operator-only small isolated pool. No final user provisions any of these resources.
name: always-on-v03
services:
  edge:
    image: caddy:2.11.9
    restart: unless-stopped
    ports: ['443:443', '80:80']
    environment:
      ALWAYS_ON_PUBLIC_HOST: ${ALWAYS_ON_PUBLIC_HOST:?operator public service hostname required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    networks:
      edge: {ipv4_address: 172.31.80.2}
    depends_on: [control]
    mem_limit: 256m
    cpus: 0.5
  control:
    build: {context: ../.., dockerfile: deploy/control/Dockerfile}
    restart: unless-stopped
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/internal-ca.pem
      ALWAYS_ON_PUBLIC_HOST: ${ALWAYS_ON_PUBLIC_HOST:?operator public service hostname required}
    volumes:
      - control_data:/data
      - ./operator/control.json:/run/config/control.json:ro
      - ./operator/secrets/internal-ca.pem:/run/secrets/internal-ca.pem:ro
      - ./operator/secrets/control-encryption-base64:/run/secrets/control-encryption-base64:ro
      - ./operator/secrets/auth0-client-secret:/run/secrets/auth0-client-secret:ro
      - ./operator/secrets/agent-a-provisioning:/run/secrets/agent-a-provisioning:ro
      - ./operator/secrets/agent-b-provisioning:/run/secrets/agent-b-provisioning:ro
    networks:
      edge: {ipv4_address: 172.31.80.3}
      agents: {}
    depends_on: [agent-a, agent-b]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  agent-a:
    build: {context: ../.., dockerfile: deploy/managed/Dockerfile}
    restart: unless-stopped
    environment:
      ALWAYS_ON_PUBLIC_ORIGIN: https://agent-a:8443
      ALWAYS_ON_TLS_CERT: /run/secrets/agent-a.pem
      ALWAYS_ON_TLS_KEY: /run/secrets/agent-a.key
      ALWAYS_ON_PROVISIONING_KEY_FILE: /run/secrets/agent-a-provisioning
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek-key
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?verified operator model ID required}
      ALWAYS_ON_EXPO_PUSH_ENABLED: ${ALWAYS_ON_EXPO_PUSH_ENABLED:-0}
      ALWAYS_ON_EXPO_PROJECT_ID: ${ALWAYS_ON_EXPO_PROJECT_ID:-}
      ALWAYS_ON_EXPO_ACCESS_TOKEN_FILE: /run/secrets/expo-token
    volumes:
      - agent_a_data:/data
      - agent_a_config:/config
      - ./operator/secrets/agent-a.pem:/run/secrets/agent-a.pem:ro
      - ./operator/secrets/agent-a.key:/run/secrets/agent-a.key:ro
      - ./operator/secrets/agent-a-provisioning:/run/secrets/agent-a-provisioning:ro
      - ./operator/secrets/deepseek-key:/run/secrets/deepseek-key:ro
      - ./operator/secrets/expo-token:/run/secrets/expo-token:ro
    networks: [agents]
    mem_limit: 1536m
    cpus: 1
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  agent-b:
    build: {context: ../.., dockerfile: deploy/managed/Dockerfile}
    restart: unless-stopped
    environment:
      ALWAYS_ON_PUBLIC_ORIGIN: https://agent-b:8443
      ALWAYS_ON_TLS_CERT: /run/secrets/agent-b.pem
      ALWAYS_ON_TLS_KEY: /run/secrets/agent-b.key
      ALWAYS_ON_PROVISIONING_KEY_FILE: /run/secrets/agent-b-provisioning
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek-key
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?verified operator model ID required}
      ALWAYS_ON_EXPO_PUSH_ENABLED: ${ALWAYS_ON_EXPO_PUSH_ENABLED:-0}
      ALWAYS_ON_EXPO_PROJECT_ID: ${ALWAYS_ON_EXPO_PROJECT_ID:-}
      ALWAYS_ON_EXPO_ACCESS_TOKEN_FILE: /run/secrets/expo-token
    volumes:
      - agent_b_data:/data
      - agent_b_config:/config
      - ./operator/secrets/agent-b.pem:/run/secrets/agent-b.pem:ro
      - ./operator/secrets/agent-b.key:/run/secrets/agent-b.key:ro
      - ./operator/secrets/agent-b-provisioning:/run/secrets/agent-b-provisioning:ro
      - ./operator/secrets/deepseek-key:/run/secrets/deepseek-key:ro
      - ./operator/secrets/expo-token:/run/secrets/expo-token:ro
    networks: [agents]
    mem_limit: 1536m
    cpus: 1
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

networks:
  edge:
    ipam:
      config: [{subnet: 172.31.80.0/24}]
  # No published agent/owner ports. Egress remains available for model/search requests.
  agents: {}
volumes:
  edge_data: {}
  edge_config: {}
  control_data: {}
  agent_a_data: {}
  agent_a_config: {}
  agent_b_data: {}
  agent_b_config: {}
